[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailsight"
version = "0.1.0"
description = "Self-hostable, explainable threat detection for AWS CloudTrail"
requires-python = ">=3.12"

[project.scripts]
trailsight = "trailsight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
